<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건 검색기</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ── 헤더 ── -->
  <header class="header">
    <div class="header-left">
      <div class="logo">🔍</div>
      <span class="title">조건 검색 필터</span>
    </div>
    <div class="header-right">
      <button type="button" class="icon-btn btn-reset-text" id="btn-log" title="액션 이력 보기">
        📋 <span>이력</span>
      </button>
      <button type="button" class="icon-btn btn-reset-text" id="btn-reset" title="조건 초기화">
        🔄 <span>초기화</span>
      </button>
      <button type="button" class="icon-btn btn-reset-text" id="btn-close" title="검색창 닫기">
        ✕ <span>닫기</span>
      </button>
    </div>
  </header>

  <!-- ── 메인 컨텐츠 ── -->
  <main class="main">
    <div class="section">

      <!-- 첫 번째 행: 발행 시각 -->
      <div class="card">
        <div class="row">
          <div class="label-box">
            <input type="checkbox" id="chk-disable-date" class="condition-toggle-chk" title="체크 해제 시 발행 시각 조건 제외" checked>
            <label for="chk-disable-date">발행 시각</label>
          </div>
          <select class="custom-select select-short" id="date-select">
            <option value="24h">24시간 이내</option>
            <option value="direct">직접 지정</option>
            <option value="month">월 단위 지정</option>
          </select>

          <span id="date-range-text" class="date-range-badge"></span>
          <input type="month" class="custom-input" id="date-month-input" style="display: none;">

          <div id="date-input-group" class="date-group" style="display: none;">
            <input type="hidden" id="date-start">
            <div class="date-display" id="date-start-display" tabindex="0"></div>
            <span class="date-separator">~</span>
            <input type="hidden" id="date-end">
            <div class="date-display" id="date-end-display" tabindex="0"></div>
          </div>

          <!-- 🗓️ 커스텀 달력 팝업 -->
          <div class="calendar-popup" id="calendar-popup">
            <div class="calendar-header">
              <button type="button" class="calendar-nav" id="cal-prev" title="이전 달">‹</button>
              <div class="calendar-month-year" id="cal-month-year"></div>
              <button type="button" class="calendar-nav" id="cal-next" title="다음 달">›</button>
            </div>
            <div class="calendar-weekdays">
              <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
            </div>
            <div class="calendar-days" id="calendar-days"></div>
          </div>

          <div class="btn-anchor-end btn-anchor-end--date">
            <button type="button" class="btn btn-secondary" id="btn-search">검색</button>
            <button type="button" class="btn btn-primary" id="btn-download">다운로드</button>
          </div>
        </div>
        <div id="date-disabled-note" class="date-disabled-note" style="display: none;">
          ⚠️ 발행 시각 조건을 해제하면, 포함 조건/제외 조건만으로 <strong>오늘 날짜</strong> 기준으로만 검색돼요.!
        </div>
      </div>

      <!-- 두 번째 행: 포함 조건 -->
      <div class="card">
        <div class="row">
          <div class="label-box">
            <input type="checkbox" id="chk-disable-include" class="condition-toggle-chk" title="체크 해제 시 포함 조건 제외" checked>
            <label for="chk-disable-include">포함 조건</label>
          </div>

          <select class="custom-select select-short" id="include-select">
            <option value="" disabled selected hidden>선택</option>
            <option value="title_keyword">제목+키워드</option>
            <option value="title">제목</option>
            <option value="keyword_text">키워드</option>
            <option value="magazine">매거진</option>
            <option value="author">작가</option>
            <option value="keyword">G.키워드</option>
          </select>

          <select class="custom-select select-short" id="sheet-select" style="display: none;">
            <option value="" disabled selected hidden>유형 선택</option>
            <option value="religion">종교</option>
            <option value="promo">홍보</option>
            <option value="no_expose">노출 불가</option>
          </select>

          <select class="custom-select select-short" id="keyword-select" style="display: none;">
            <option value="">키워드 선택</option>
          </select>

          <input type="text" class="custom-input input-keyword" id="include-input" placeholder="키워드 입력.." autocomplete="off" style="display: none;">

          <div class="tag-container" id="include-tag-container"></div>

          <div class="btn-anchor-end">
            <button type="button" class="btn btn-small" id="btn-include-add">추가</button>
            <button type="button" class="btn btn-small" id="btn-include-save">저장</button>
            <button type="button" class="btn btn-small" id="btn-include-tags-reset" title="선택된 키워드 전체 초기화">초기화</button>
          </div>
        </div>
      </div>

      <!-- 세 번째 행: 제외 조건 -->
      <div class="card">
        <div class="row">
          <div class="label-box">
            <input type="checkbox" id="chk-disable-exclude" class="condition-toggle-chk" title="체크 해제 시 제외 조건 제외" checked>
            <label for="chk-disable-exclude">제외 조건</label>
          </div>
          <select class="custom-select select-short" id="exclude-select">
            <option value="" disabled selected hidden>유저 타입</option>
            <option value="white">화이트유저</option>
            <option value="gray">그레이유저</option>
            <option value="black">블랙유저</option>
            <option value="red">레드유저</option>
            <option value="membership_pro">멤버십 전문 조회</option>
          </select>

          <div class="tag-container" id="exclude-tag-container"></div>
        </div>
      </div>

      <!-- 💡 안내 레이어 -->
      <div id="search-loading-box" style="display: none; padding: 8px 12px; background: rgba(91, 141, 239, 0.1); border: 1px solid rgba(91, 141, 239, 0.3); border-radius: 6px; text-align: center;">
        <span style="font-size: 11px; font-weight: 600; color: #5B8DEF;">
          🔍 전체 페이지 데이터를 탐색 및 필터링하는 중입니다... 잠시만 기다려주세요.
        </span>
      </div>

      <!-- 📜 검색 진행 로그 -->
      <div id="search-log-box" style="display: none; max-height: 160px; overflow-y: auto; padding: 8px 10px; background: #1c2230; border-radius: 6px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; line-height: 1.6; color: #b8c2d9;"></div>

    </div>
  </main>

  <!-- ── 1. 키워드별 시트 선택 팝업 모달 ── -->
  <div class="modal-overlay" id="sheet-mapping-modal" role="dialog" aria-modal="true">
    <div class="modal-content modal-large">
      <div class="modal-title">Google docs 저장 시트 선택</div>
      <div class="modal-desc">각 키워드를 저장할 구글 시트를 선택해 주세요.</div>

      <div class="modal-mapping-list" id="modal-mapping-list"></div>

      <div class="modal-actions">
        <button type="button" class="btn btn-small" id="btn-modal-cancel">취소</button>
        <button type="button" class="btn btn-primary" id="btn-modal-save-start">저장</button>
      </div>
    </div>
  </div>

  <!-- ── 2. 저장 결과 알림 팝업 모달 ── -->
  <div class="modal-overlay" id="alert-modal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <div class="modal-title" id="alert-title">안내</div>
      <div class="modal-desc" id="alert-message"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-primary" id="btn-alert-close">확인</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
